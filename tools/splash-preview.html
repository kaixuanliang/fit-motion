<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#05090A; display:flex; justify-content:center; }
  .phone { width:430px; height:900px; position:relative; overflow:hidden; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .logo { width:84px; height:84px; border-radius:50%; box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 8px 30px rgba(216,255,62,.12); }
  .name { margin-top:18px; color:#fff; font:500 21px/1 "Barlow Condensed", "PingFang SC", sans-serif; letter-spacing:.18em; }
  .rule { margin-top:14px; width:22px; height:3px; background:#D8FF3E; border-radius:2px; }
  .tag { margin-top:12px; color:#93A19A; font:400 13px/1 "PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:.1em; }
  .status { position:absolute; top:0; left:0; right:0; height:34px; }
</style>
</head>
<body>
<div class="phone">
  <div class="center">
    <img class="logo" src="../android/res/mipmap-xxxhdpi/ic_launcher_round.png">
    <div class="name">FIT MOTION</div>
    <div class="rule"></div>
    <div class="tag">轨迹，成影像</div>
  </div>
</div>
</body>
</html>
